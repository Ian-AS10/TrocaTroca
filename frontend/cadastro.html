<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - TrocaTroca</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        🔄 TrocaTroca
    </a>

    <nav class="nav">

        <a href="index.html">
            Início
        </a>

        <a href="login.html">
            Entrar
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-icon">
                👤
            </div>

            <h1>Criar conta</h1>

            <p>
                Cadastre-se para começar a trocar.
            </p>

        </div>


        <form id="cadastroForm">

            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    required
                >

            </div>


            <button type="submit" class="button full-button">
                Criar conta
            </button>

            <div id="cadastroMessage"></div>

        </form>


        <div class="auth-footer">

            <p>
                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </div>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>

</body>

</html>
